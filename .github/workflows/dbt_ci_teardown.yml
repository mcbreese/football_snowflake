# The name of the pipeline as it appears in the GitHub Actions dashboard
name: dbt CI Teardown

# Fires on merged AND abandoned/closed-without-merge PRs alike - either way
# the PR's throwaway CI_ANALYTICS schema should go, so there's no need to
# branch on github.event.pull_request.merged.
on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  teardown:
    # Run the workflow on a fresh GitHub-hosted Ubuntu runner
    runs-on: ubuntu-latest

    # Global environment variables accessible across steps
    # Note: Sensitive values are pulled directly from GitHub Repository Secrets
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      RSA_KEY_CONTENTS: ${{ secrets.RSA_KEY_CONTENTS }}
      PK_PASSPHRASE: ${{ secrets.PK_PASSPHRASE }}
      PK_PATH: "./rsa_key.p8" # Define variable here, we will write to it in a later step
      DBT_CI_SCHEMA: "pr_${{ github.event.pull_request.number }}"

    # Set default execution directory to the dbt project folder for all run steps
    defaults:
      run:
        working-directory: ./dbt_football_snowflake

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Installs the exact dbt-core/dbt-snowflake versions pinned in
      # uv.lock - matches local dev exactly (CLAUDE.md's "Always invoke
      # dbt via uv run dbt ..." rule), instead of pip's previous floating
      # `==1.12.*` install which could silently drift to a different
      # patch version than what's locked.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # pyproject.toml/uv.lock live at the repo root, not
      # dbt_football_snowflake/ (this job's default working-directory) -
      # override just for this step.
      - name: Install dependencies
        working-directory: .
        run: uv sync --locked

      - name: Write RSA Key to File
        run: |
          printf '%s\n' "$RSA_KEY_CONTENTS" > rsa_key.p8
          chmod 600 rsa_key.p8
          ls -la rsa_key.p8

      - name: Install dbt packages
        run: uv run dbt deps --profiles-dir .

      # DROP SCHEMA IF EXISTS makes this a clean no-op for PRs that were
      # closed without ever triggering a CI build.
      - name: Drop PR's CI schema
        run: uv run dbt run-operation drop_ci_schema --target ci --profiles-dir .
