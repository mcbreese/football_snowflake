# The name of the pipeline as it appears in the GitHub Actions dashboard
name: dbt Prod Deploy

# This is the source-of-truth prod deploy (writes to PRD_ANALYTICS via
# PROD_ROLE) triggered on every push to main, not a redundant duplicate of
# dbt_test.yml's PR check - so it doesn't reintroduce the double-build cost
# problem that push:main trigger was originally removed for. Its manifest
# artifact is what dbt_test.yml diffs PRs against via state:modified+.
#
# Deploys selectively (state:modified+ against this workflow's own last
# successful run), not a full rebuild - this only covers deploying merged
# code changes cheaply. Data freshness for unchanged models (in particular
# int_player_appearances, which is incremental and won't be reselected
# just because time has passed) is handled separately by
# dbt_scheduled.yml, a weekly full `dbt build` against prod - see that
# workflow for details.
on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read # needed to find this workflow's own last successful run

jobs:
  deploy:
    # Run the workflow on a fresh GitHub-hosted Ubuntu runner
    runs-on: ubuntu-latest

    # Global environment variables accessible across steps
    # Note: Sensitive values are pulled directly from GitHub Repository Secrets
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      RSA_KEY_CONTENTS: ${{ secrets.RSA_KEY_CONTENTS }}
      PK_PASSPHRASE: ${{ secrets.PK_PASSPHRASE }}
      PK_PATH: "./rsa_key.p8" # Define variable here, we will write to it in a later step

    # Set default execution directory to the dbt project folder for all run steps
    defaults:
      run:
        working-directory: ./dbt_football_snowflake

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Installs the exact dbt-core/dbt-snowflake versions pinned in
      # uv.lock - matches local dev exactly (CLAUDE.md's "Always invoke
      # dbt via uv run dbt ..." rule), instead of pip's previous floating
      # `==1.12.*` install which could silently drift to a different
      # patch version than what's locked.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # pyproject.toml/uv.lock live at the repo root, not
      # dbt_football_snowflake/ (this job's default working-directory) -
      # override just for this step.
      #
      # --locked: install exactly what's in uv.lock and fail instead of
      # re-resolving if pyproject.toml and the lockfile have drifted out
      # of sync - surfaces a stale lockfile as a CI failure instead of
      # silently installing different versions than what's committed.
      - name: Install dependencies
        working-directory: .
        run: uv sync --locked

      - name: Write RSA Key to File
        run: |
          printf '%s\n' "$RSA_KEY_CONTENTS" > rsa_key.p8
          chmod 600 rsa_key.p8
          ls -la rsa_key.p8

      - name: Check dbt connection
        run: uv run dbt debug --target prod --profiles-dir .

      - name: Install dbt packages
        run: uv run dbt deps --profiles-dir .

      # --- Selective deploy: find this workflow's own last successful run
      # so we can diff against its manifest via state:modified+. Falls back
      # to a full build below if none is found (first-ever run, or the
      # artifact expired/missing). ---

      - name: Find previous successful deploy run
        id: find_run
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'dbt_deploy.yml',
              branch: 'main',
              status: 'success',
              per_page: 1,
            });
            if (runs.data.workflow_runs.length === 0) {
              core.info('No previous successful dbt_deploy.yml run found - will fall back to a full build.');
              core.setOutput('run_id', '');
            } else {
              core.setOutput('run_id', String(runs.data.workflow_runs[0].id));
            }

      - name: Download previous manifest
        if: steps.find_run.outputs.run_id != ''
        continue-on-error: true # missing/expired artifact -> fall back to full build, don't hard-fail
        uses: actions/download-artifact@v4
        with:
          name: prod-manifest
          path: ./dbt_football_snowflake/state
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find_run.outputs.run_id }}

      - name: Determine build mode
        id: build_mode
        run: |
          if [ -f ./state/manifest.json ]; then
            echo "mode=state" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

      # Deploy only what changed + its downstream dependents. No --defer:
      # this runs for real against prod, so unselected refs already
      # resolve correctly to their existing PRD_ANALYTICS relations.
      - name: Run dbt build (prod, selective)
        if: steps.build_mode.outputs.mode == 'state'
        run: uv run dbt build --target prod --select state:modified+ --state ./state --profiles-dir .

      # No prior manifest available - build everything, same as before this
      # change.
      - name: Run dbt build (prod, full)
        if: steps.build_mode.outputs.mode == 'full'
        run: uv run dbt build --target prod --profiles-dir .

      # Only reached if the build above succeeded, so a failed prod build
      # never publishes a manifest representing broken/partial state for
      # PR runs (or the next deploy) to diff against.
      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-manifest
          path: dbt_football_snowflake/target/manifest.json
          retention-days: 90

  # Regenerates dbt docs from prod state after a successful deploy. Not
  # published anywhere (no GitHub Pages) - just the generated site +
  # catalog as a downloadable artifact, per user's explicit preference.
  docs:
    needs: deploy
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      RSA_KEY_CONTENTS: ${{ secrets.RSA_KEY_CONTENTS }}
      PK_PASSPHRASE: ${{ secrets.PK_PASSPHRASE }}
      PK_PATH: "./rsa_key.p8"

    defaults:
      run:
        working-directory: ./dbt_football_snowflake

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: .
        run: uv sync --locked

      - name: Write RSA Key to File
        run: |
          printf '%s\n' "$RSA_KEY_CONTENTS" > rsa_key.p8
          chmod 600 rsa_key.p8

      - name: Install dbt packages
        run: uv run dbt deps --profiles-dir .

      # Queries prod's information schema for the catalog, so this needs
      # real prod credentials - same target the deploy job just wrote to.
      - name: Generate dbt docs
        run: uv run dbt docs generate --target prod --profiles-dir .

      - name: Upload dbt docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            dbt_football_snowflake/target/index.html
            dbt_football_snowflake/target/manifest.json
            dbt_football_snowflake/target/catalog.json
            dbt_football_snowflake/target/run_results.json
          retention-days: 90
