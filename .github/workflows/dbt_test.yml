# The name of the pipeline as it appears in the GitHub Actions dashboard
name: dbt CI Pipeline

# Trigger the pipeline on pull requests targeting the main branch. Not on
# push: main - main is merge-protected on this check, so a push to main
# only ever happens via a PR that already ran this build; re-running it
# again on push would just double the compute cost per merge for no new
# information. (dbt_deploy.yml is the one push:main workflow, and it does
# a genuinely different thing - the actual prod deploy - not a repeat of
# this check.)
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read # needed to find/download the manifest artifact from dbt_deploy.yml/dbt_scheduled.yml's runs

jobs:
  run-dbt:
    # Skipped for Dependabot: GitHub withholds normal Actions secrets from
    # Dependabot-triggered runs (only the separate "Dependabot secrets" store
    # is exposed), so every Snowflake credential below would be empty and the
    # job would fail at `dbt debug` with a PEM error, whatever the bump
    # contained. Deliberately not mirrored into the Dependabot secrets store,
    # to avoid a second copy of the CI key-pair. github.actor (not the PR
    # author) is the right check: a re-run keeps the original actor, while a
    # human pushing to a dependabot/ branch gets normal secrets back.
    # Note a skipped job reports as passing for branch protection.
    if: github.actor != 'dependabot[bot]'

    # Run the workflow on a fresh GitHub-hosted Ubuntu runner
    runs-on: ubuntu-latest

    # Global environment variables accessible across steps
    # Note: Sensitive values are pulled directly from GitHub Repository Secrets
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      RSA_KEY_CONTENTS: ${{ secrets.RSA_KEY_CONTENTS }}
      PK_PASSPHRASE: ${{ secrets.PK_PASSPHRASE }}
      PK_PATH: "./rsa_key.p8" # Define variable here, we will write to it in a later step
      DBT_CI_SCHEMA: "pr_${{ github.event.pull_request.number }}"

    # Set default execution directory to the dbt project folder for all run steps
    defaults:
      run:
        working-directory: ./dbt_football_snowflake

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the exact dbt-core/dbt-snowflake versions pinned in
      # uv.lock - matches local dev exactly (CLAUDE.md's "Always invoke
      # dbt via uv run dbt ..." rule), instead of pip's previous floating
      # `==1.12.*` install which could silently drift to a different
      # patch version than what's locked.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # pyproject.toml/uv.lock live at the repo root, not
      # dbt_football_snowflake/ (this job's default working-directory) -
      # override just for this step.
      #
      # --locked: install exactly what's in uv.lock and fail instead of
      # re-resolving if pyproject.toml and the lockfile have drifted out
      # of sync - surfaces a stale lockfile as a CI failure instead of
      # silently installing different versions than what's committed.
      - name: Install dependencies
        working-directory: .
        run: uv sync --locked

      - name: Write RSA Key to File
        run: |
          printf '%s\n' "$RSA_KEY_CONTENTS" > rsa_key.p8
          chmod 600 rsa_key.p8
          ls -la rsa_key.p8

      - name: Check dbt connection
        run: uv run dbt debug --target ci --profiles-dir .

      - name: Install dbt packages
        run: uv run dbt deps --profiles-dir .

      # --- State-based CI: fetch the most recent successful prod manifest
      # so PR builds can diff against real prod state via state:modified+.
      # Falls back to a full build below if no manifest is found. ---

      # Checks both dbt_deploy.yml (deploys merged code changes) and
      # dbt_scheduled.yml (weekly full rebuild, catches drift in unchanged
      # incremental models) and picks whichever succeeded most recently,
      # since either can be the freshest true picture of prod state.
      - name: Find latest successful prod build run
        id: find_run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // listWorkflowRuns 404s (not an empty result) if the workflow
            // doesn't exist on the default branch yet - true on the very
            // first PR that introduces it, since GitHub only indexes a
            // workflow by filename once it's present on main. Treat that
            // the same as "no runs yet" for that workflow.
            async function latestRun(workflow_id) {
              try {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id,
                  branch: 'main',
                  status: 'success',
                  per_page: 1,
                });
                return runs.data.workflow_runs[0] || null;
              } catch (error) {
                core.info(`Could not look up ${workflow_id} runs (${error.message}) - treating as no runs found.`);
                return null;
              }
            }

            const candidates = (await Promise.all(
              ['dbt_deploy.yml', 'dbt_scheduled.yml'].map(latestRun)
            )).filter(run => run !== null);

            if (candidates.length === 0) {
              core.info('No successful dbt_deploy.yml or dbt_scheduled.yml run found yet - will fall back to a full build.');
              core.setOutput('run_id', '');
              core.setOutput('run_created_at', '');
            } else {
              const latest = candidates.reduce((a, b) =>
                new Date(a.created_at) > new Date(b.created_at) ? a : b
              );
              core.setOutput('run_id', String(latest.id));
              core.setOutput('run_created_at', latest.created_at);
            }

      - name: Download prod manifest
        if: steps.find_run.outputs.run_id != ''
        continue-on-error: true # missing/expired artifact -> fall back to full build, don't hard-fail
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prod-manifest
          path: ./dbt_football_snowflake/state
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find_run.outputs.run_id }}

      - name: Warn if prod manifest is stale
        if: steps.find_run.outputs.run_id != ''
        run: |
          RUN_DATE="${{ steps.find_run.outputs.run_created_at }}"
          RUN_EPOCH=$(date -d "$RUN_DATE" +%s)
          NOW_EPOCH=$(date +%s)
          AGE_DAYS=$(( (NOW_EPOCH - RUN_EPOCH) / 86400 ))
          if [ "$AGE_DAYS" -gt 7 ]; then
            echo "::warning::Prod manifest used for state comparison is $AGE_DAYS days old (from run ${{ steps.find_run.outputs.run_id }}). state:modified+ selection may be stale relative to main."
          fi

      - name: Determine build mode
        id: build_mode
        run: |
          if [ -f ./state/manifest.json ]; then
            echo "mode=state" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

      # Build modified models + their downstream dependents only, resolving
      # refs to unbuilt nodes against prod's last known state.
      - name: Run dbt build (state-based)
        if: steps.build_mode.outputs.mode == 'state'
        run: uv run dbt build --target ci --select state:modified+ --state ./state --defer --profiles-dir .

      # No prior prod manifest available (first-ever run, or the artifact
      # expired/was missing) - build everything, same as before this change.
      - name: Run dbt build (full)
        if: steps.build_mode.outputs.mode == 'full'
        run: uv run dbt build --target ci --profiles-dir .

  # Runs independently of run-dbt (no `needs:`) so a style violation surfaces
  # fast without waiting on the slower state-based build. Checks only -
  # never runs `black`/`sqlfluff fix` here, since a job that rewrites files
  # has no clean way to get those changes back into the PR branch without a
  # bot-commit step. Reuses the same `ci`-target credentials run-dbt already
  # has - no new secrets needed, just pointed at sqlfluff's dbt templater
  # instead of a real build.
  lint:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      RSA_KEY_CONTENTS: ${{ secrets.RSA_KEY_CONTENTS }}
      PK_PASSPHRASE: ${{ secrets.PK_PASSPHRASE }}
      PK_PATH: "./rsa_key.p8"
      DBT_CI_SCHEMA: "pr_${{ github.event.pull_request.number }}"
      DBT_ENGINE_TARGET: ci

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # No credentials or dbt compilation needed for this one - runs first
      # so a pure style issue fails as fast as possible.
      - name: Black --check
        run: uv run black --check --diff main.py profiling/ extraction/

      # extraction/'s tests mock both Kaggle and S3 (moto), so this needs
      # no credentials either - safe to run alongside the style checks.
      - name: Extraction unit tests
        run: uv run pytest extraction/tests

      # Steps below need Snowflake credentials (sqlfluff's dbt templater
      # connects to compile), which Dependabot runs don't receive - see the
      # note on run-dbt. Black and pytest above still run for Dependabot, so
      # a bump that breaks the Python tooling is still caught.
      - name: Write RSA Key to File
        if: github.actor != 'dependabot[bot]'
        working-directory: ./dbt_football_snowflake
        run: |
          printf '%s\n' "$RSA_KEY_CONTENTS" > rsa_key.p8
          chmod 600 rsa_key.p8

      # sqlfluff's dbt templater needs dbt_utils (generate_surrogate_key
      # etc.) installed to compile the project before it can lint anything.
      - name: Install dbt packages
        if: github.actor != 'dependabot[bot]'
        working-directory: ./dbt_football_snowflake
        run: uv run dbt deps --profiles-dir .

      - name: SQLFluff lint
        if: github.actor != 'dependabot[bot]'
        working-directory: ./dbt_football_snowflake
        run: uv run sqlfluff lint models/
