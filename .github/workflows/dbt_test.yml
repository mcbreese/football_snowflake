# The name of the pipeline as it appears in the GitHub Actions dashboard
name: dbt CI Pipeline

# Trigger the pipeline on pushes or pull requests targeting the main branch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-dbt:
    # Run the workflow on a fresh GitHub-hosted Ubuntu runner
    runs-on: ubuntu-latest

    # Global environment variables accessible across steps
    # Note: Sensitive values are pulled directly from GitHub Repository Secrets
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      RSA_KEY_CONTENTS: ${{ secrets.RSA_KEY_CONTENTS }}
      PK_PASSPHRASE: ${{ secrets.PK_PASSPHRASE }}
      PK_PATH: "./rsa_key.p8" # Define variable here, we will write to it in a later step

    # Set default execution directory to the dbt project folder for all run steps
    defaults:
      run:
        working-directory: ./dbt_football_snowflake

    steps:
      # Checkout the repository source code onto the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set up Python environment required for running dbt
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install dbt core and the Snowflake adapter
      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake

      # Materialise the RSA private key from secrets into a temporary file on the runner
      # Restrict file permissions using chmod 600 for security
      - name: Write RSA Key to File
        run: |
          echo "${{ secrets.RSA_KEY_CONTENTS }}" > rsa_key.p8
          chmod 600 rsa_key.p8
          ls -la rsa_key.p8

      # Verify database connection credentials and profile configuration
      # Explicitly pass PK_PATH pointing to the generated file and force dbt to use the local profile folder
      - name: Check dbt connection
        run: dbt debug --profiles-dir .

      # Download and resolve external package dependencies defined in packages.yml
      - name: Install dbt packages
        run: dbt deps --profiles-dir .

      # Execute data assertions, schema tests, and model validations
      - name: Run dbt tests
        run: dbt test --profiles-dir .
