
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organisation's
# name or the intended use of these models
name: 'dbt_football_snowflake'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'dbt_football_snowflake'

# Keeps local/CI/future-contributor environments from silently drifting onto an
# untested dbt-core version. Matches the pin in pyproject.toml / CI.
require-dbt-version: [">=1.12.0", "<2.0.0"]

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target" # directory which will store compiled SQL and documentation files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

flags:
  use_materialization_v2: True # Added this in as terminal output said it was new

# dbt_project_evaluator's tests default to severity: error, which would hard-fail
# a build on any violation. Starting at warn for the first assessment pass so the
# build completes and produces a full list of findings instead of stopping at the
# first one - see CLAUDE.md for how findings get reviewed.
vars:
  dbt_project_evaluator:
    severity: warn

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  # dbt_project_evaluator's own diagnostic models get their own schema so they
  # don't land mixed in with real staging/intermediate/gold models - resolves to
  # DEV_ANALYTICS.football_dbt_project_evaluator under dev (see
  # macros/generate_schema_name.sql for exactly how).
  dbt_project_evaluator:
    +schema: dbt_project_evaluator

  dbt_football_snowflake:
    +persist_docs: # Configuration for pushing dbt documentation to the database
      relation: true # Push the model's description (relation) as a comment on the table/view
      columns: true # Push column descriptions as comments on the respective columns

    staging:
      +enabled: true
      +tags: ["bronze", "staging"] # all staging should be tagged with minimum ["bronze", "staging"]
      +materialized: view # stg best practice is view
      +schema: stg
      +docs:
        node_color: "#CD7F32" # bronze color

    intermediate:
      +tags: ["silver", "intermediate"] # all intermediate should be tagged with minimum ["bronze", "intermediate"]
      +materialized: view # stg best practice is view
      +schema: int
      +docs:
        node_color: "#A0A0A0" # silver color

    gold:
      +tags: ["gold", "marts"] # all marts should be tagged with minimum ["silver", "marts"]
      +materialized: table # mart/gold best practice is tbl
      +schema: gold
      +docs:
        node_color: "#FFD700" # gold color

seeds:
  dbt_football_snowflake:
    dim_transfer_date:
      +schema: gold
      +column_types:
        date_key: INT
        date_day: DATE
        transfer_season: STRING
