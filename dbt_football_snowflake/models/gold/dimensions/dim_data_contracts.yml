version: 2

models:
  # --------------------------------------------------------------------------------------
  # 1. dim_clubs
  # --------------------------------------------------------------------------------------
  - name: dim_clubs
    <<: &dim_meta_anchor
      config:
        meta:
          owner: "Analytics Department"
          usage: "Club reference table for joining to facts"
        materialized: table
        contract:
          enforced: true
    description: "{{ doc('dim_clubs_model_description') }}"
    columns:
      - name: club_sk
        description: "{{ doc('club_sk_pk') }}"
        data_type: STRING
        tests: &dim_pk_tests_anchor
          - not_null
          - unique
      - name: club_id
        description: "{{ doc('club_id') }}"
        data_type: INT
        tests:
          - not_null
          - unique
      - name: name
        description: "{{ doc('club_name') }}"
        data_type: STRING
        tests:
          - not_null
      - name: loaded_timestamp
        description: "{{ doc('loaded_timestamp_dim') }}"
        data_type: TIMESTAMP

  # --------------------------------------------------------------------------------------
  # 2. dim_competitions
  # --------------------------------------------------------------------------------------
  - name: dim_competitions
    <<: *dim_meta_anchor # Reuse anchor
    description: "{{ doc('dim_competitions_model_description') }}"
    columns:
      - name: competition_sk
        description: "{{ doc('competition_sk_pk') }}"
        data_type: STRING
        tests: *dim_pk_tests_anchor
      - name: competition_id
        description: "{{ doc('competition_id') }}"
        data_type: STRING
        tests:
          - not_null
          - unique
      - name: name
        description: "{{ doc('competition_name_dim') }}"
        data_type: STRING
      - name: type
        description: "{{ doc('competition_type') }}"
        data_type: STRING
      - name: sub_type
        description: "{{ doc('competition_sub_type') }}"
        data_type: STRING
      - name: country_name
        description: "{{ doc('competition_country_name') }}"
        data_type: STRING
      - name: loaded_timestamp
        description: "{{ doc('loaded_timestamp_dim') }}"
        data_type: TIMESTAMP

  # --------------------------------------------------------------------------------------
  # 3. dim_players
  # --------------------------------------------------------------------------------------
  - name: dim_players
    <<: *dim_meta_anchor # Reuse anchor
    description: "{{ doc('dim_players_model_description') }}"
    columns:
      - name: player_sk
        description: "{{ doc('player_sk_pk') }}"
        data_type: STRING
        tests: *dim_pk_tests_anchor
      - name: player_id
        description: "{{ doc('player_id') }}"
        data_type: INT
        tests:
          - not_null
          - unique
      - name: player_name
        description: "{{ doc('player_name') }}"
        data_type: STRING
        tests:
          - not_null
      - name: nationality
        description: "{{ doc('nationality') }}"
        data_type: STRING
      - name: sub_position
        description: "{{ doc('sub_position') }}"
        data_type: STRING
      - name: foot
        description: "{{ doc('foot') }}"
        data_type: STRING
      - name: age_in_years
        description: "{{ doc('age_in_years') }}"
        data_type: DECIMAL(18,8)
      - name: last_season
        description: "{{ doc('last_season') }}"
        data_type: INT
      - name: loaded_timestamp
        description: "{{ doc('loaded_timestamp_dim') }}"
        data_type: TIMESTAMP

  # --------------------------------------------------------------------------------------
  # 4. dim_transfer_date
  # --------------------------------------------------------------------------------------
  - name: dim_transfer_date
    <<: *dim_meta_anchor # Reuse anchor
    description: "{{ doc('dim_transfer_date_model_description') }}"
    columns:
      - name: date_key
        description: "{{ doc('date_key') }}"
        data_type: INT
        tests: *dim_pk_tests_anchor
      - name: date_day
        description: "{{ doc('date_day') }}"
        data_type: DATE
        tests:
          - not_null
          - unique
      - name: transfer_season
        description: "{{ doc('transfer_season_dim') }}"
        data_type: STRING