version: 2

models:
  # --------------------------------------------------------------------------------------
  # 1. fct_player_performance_per_season_competition
  # --------------------------------------------------------------------------------------
  - name: fct_player_performance_per_season_competition
    <<: &fct_meta_anchor
      config:
        meta:
          owner: "Analytics / Data Science"
          usage: "Primary Mart for Player Scouting and Trend Analysis"
        materialized: table
        contract:
          enforced: true # Ensure schema integrity for the Gold Layer
    description: "{{ doc('fct_performance_model_description') }}"
    columns:
      - name: player_performance_sk
        description: "{{ doc('player_performance_sk') }}"
        data_type: STRING
        tests:
          - not_null
          - unique
      - name: player_id
        description: "{{ doc('player_id') }}" # Inherited from Staging Docs
        data_type: INT
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
      - name: club_id
        description: "{{ doc('club_id') }}" # Inherited from Staging Docs
        data_type: INT
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_clubs')
                field: club_id
      - name: season
        description: "{{ doc('season') }}" # Inherited from Staging Docs
        data_type: INT
        tests:
          - not_null
      - name: competition_name
        description: "{{ doc('competition_name_fct') }}" # New block
        data_type: STRING
        tests:
          - not_null
      - name: total_appearances
        description: "{{ doc('total_appearances') }}" # New block
        data_type: NUMBER
      - name: total_yellow_cards
        description: "{{ doc('total_yellow_cards') }}" # New block
        data_type: NUMBER
      - name: total_red_cards
        description: "{{ doc('total_red_cards') }}" # New block
        data_type: NUMBER
      - name: total_goals
        description: "{{ doc('total_goals') }}" # New block
        data_type: NUMBER
      - name: total_assists
        description: "{{ doc('total_assists') }}" # New block
        data_type: NUMBER
      - name: total_minutes_played
        description: "{{ doc('total_minutes_played') }}" # New block
        data_type: NUMBER
      - name: avg_mins_per_appearance
        description: "{{ doc('avg_mins_per_appearance') }}" # New block
        data_type: DECIMAL(18, 8)
      - name: avg_goals_per_90_mins
        description: "{{ doc('avg_goals_per_90_mins') }}" # New block
        data_type: DECIMAL(18, 8)
      - name: games_won
        description: "{{ doc('games_won') }}" # New block
        data_type: NUMBER
      - name: games_lost
        description: "{{ doc('games_lost') }}" # New block
        data_type: NUMBER
      - name: games_drawn
        description: "{{ doc('games_drawn') }}" # New block
        data_type: NUMBER
      - name: first_appearance_loaded_timestamp
        description: "{{ doc('first_appearance_loaded_timestamp') }}" # New block
        data_type: TIMESTAMP
        tests:
          - not_null

  # -----------------------------------------------------------
  # 2. fct_player_transfers
  # -----------------------------------------------------------
  - name: fct_player_transfers
    <<: *fct_meta_anchor # Reuse the same metadata anchor
    description: "{{ doc('fct_transfers_model_description') }}"
    columns:
      - name: player_transfer_sk
        description: "{{ doc('player_transfer_sk') }}"
        data_type: STRING
        tests:
          - not_null
          - unique
      - name: player_id
        description: "{{ doc('player_id') }}" # Inherited from Staging Docs
        data_type: INT
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
      - name: from_club_id
        description: "{{ doc('from_club_id') }}" # New block
        data_type: INT
        # removed ref to club_id due to data issue with dim
      - name: to_club_id
        description: "{{ doc('to_club_id') }}" # New block
        data_type: INT
        # removed ref to club_id due to data issue with dim
      - name: transfer_date_key
        description: "{{ doc('date_key') }}"
        data_type: INT
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_transfer_date')
                field: date_key
      - name: transfer_date
        description: "{{ doc('transfer_date') }}" # Inherited from Staging Docs
        data_type: DATE
        tests:
          - not_null
      - name: transfer_fee
        description: "{{ doc('transfer_fee') }}" # New block
        data_type: NUMBER
      - name: market_value_in_eur
        description: "{{ doc('market_value_in_eur') }}" # New block
        data_type: NUMBER
      - name: transfer_season
        description: "{{ doc('transfer_season') }}" # New block
        data_type: STRING
      - name: transfer_loaded_timestamp
        description: "{{ doc('transfer_loaded_timestamp') }}" # Inherited from Staging Docs
        data_type: TIMESTAMP
