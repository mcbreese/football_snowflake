      - name: home_away
        description: "{{ doc('home_away') }}"
        data_type: STRING
      - name: outcome
        description: "{{ doc('outcome') }}"
        data_type: STRING
      - name: player_win_loss
        description: "{{ doc('player_win_loss') }}"
        data_type: STRING
      - name: competition_name
        description: "{{ doc('competition_name') }}"
        data_type: STRING
      - name: competition_type
        description: "{{ doc('competition_type') }}"
        data_type: STRING
      - name: player_id
        description: "{{ doc('player_id') }}"
        data_type: INT
      - name: club_id
        description: "{{ doc('club_id') }}"
        data_type: INT
      - name: game_id
        description: "{{ doc('game_id') }}"
        data_type: INT
      - name: appearance_id
        description: "{{ doc('appearance_id') }}"
        data_type: STRING
      - name: home_club_id
        description: "{{ doc('home_club_id') }}"
        data_type: INT
      - name: away_club_id
        description: "{{ doc('away_club_id') }}"
        data_type: INT
      - name: appearance_loaded_timestamp
        description: "{{ doc('loaded_timestamp') }}"
        data_type: TIMESTAMP
