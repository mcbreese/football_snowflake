version: 2

models:
  - name: int_player_appearances
    config:
      meta:
        owner: "Data Engineering"
      contract:
        enforced: true
    description: "{{ doc('int_player_appearances_model_description') }}"
    columns:
      - name: player_appearance_sk
        description: "{{ doc('player_appearance_sk') }}"
        data_type: STRING
        tests:
          - not_null
          - unique
      - name: player_name
        description: "{{ doc('player_name') }}"
        data_type: STRING
      - name: club_name
        description: "{{ doc('club_name') }}"
        data_type: STRING
      - name: date_of_birth
        description: "{{ doc('date_of_birth') }}"
        data_type: DATE
      - name: appearance_date
        description: "{{ doc('appearance_date') }}"
        data_type: DATE
      - name: appearance_age_in_years
        description: "{{ doc('appearance_age_in_years') }}"
        data_type: INT
      - name: season
        description: "{{ doc('season') }}"
        data_type: INT
      - name: yellow_cards
        description: "{{ doc('yellow_cards') }}"
        data_type: INT
      - name: red_cards
        description: "{{ doc('red_cards') }}"
        data_type: INT
      - name: goals
        description: "{{ doc('goals') }}"
        data_type: INT
      - name: assists
        description: "{{ doc('assists') }}"
        data_type: INT
      - name: minutes_played
        description: "{{ doc('minutes_played') }}"
        data_type: INT
      - name: home_club_goals
        description: "{{ doc('home_club_goals') }}"
