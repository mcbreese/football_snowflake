version: 2

models:
  - name: stg_games
    config:
      meta:
        owner: "Data Engineering"
      contract:
        enforced: true
    description: "{{ doc('stg_games_model_description') }}"
    columns:
      - name: game_sk
        description: "{{ doc('game_sk') }}"
        data_type: STRING
        tests:
          - not_null
          - unique
      - name: game_id
        description: "{{ doc('game_id') }}"
        data_type: INT
        tests:
          - not_null
          - unique
      - name: competition_id
        description: "{{ doc('competition_id') }}"
        data_type: STRING
        tests:
          - relationships:
              arguments:
                to: ref('stg_competitions')
                field: competition_id
      - name: home_club_id
        description: "{{ doc('home_club_id') }}"
        data_type: INT
        tests:
          - relationships:
              arguments:
                to: ref('stg_clubs')
                field: club_id
      - name: away_club_id
        description: "{{ doc('away_club_id') }}"
        data_type: INT
        tests:
          - relationships:
              arguments:
                to: ref('stg_clubs')
                field: club_id
      - name: season
        description: "{{ doc('season') }}"
        data_type: INT
      - name: game_date
        description: "{{ doc('game_date') }}"
        data_type: DATE
      - name: home_club_goals
        description: "{{ doc('home_club_goals') }}"
        data_type: INT
      - name: away_club_goals
        description: "{{ doc('away_club_goals') }}"
        data_type: INT
      - name: loaded_timestamp
        description: "{{ doc('loaded_timestamp') }}"
        data_type: TIMESTAMP
      - name: source_file
        description: "{{ doc('source_file') }}"
        data_type: STRING
