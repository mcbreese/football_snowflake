version: 2

models:
  - name: stg_player_valuations
    config:
      meta:
        owner: "Data Engineering"
      contract:
        enforced: true
    description: "{{ doc('stg_player_valuations_model_description') }}"
    columns:
      - name: player_valuation_sk
        description: "{{ doc('player_valuation_sk') }}"
        data_type: STRING
        tests:
          - not_null
          - unique
      - name: player_id
        description: "{{ doc('player_id') }}"
        data_type: INT
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_players')
                field: player_id
      - name: current_club_id
        description: "{{ doc('current_club_id') }}"
        data_type: INT
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_clubs')
                field: club_id
      - name: valuation_date
        description: "{{ doc('valuation_date') }}"
        data_type: DATE
      - name: market_value_in_eur
        description: "{{ doc('market_value_in_eur') }}"
        data_type: DECIMAL(15, 3)
      - name: loaded_timestamp
        description: "{{ doc('loaded_timestamp') }}"
        data_type: TIMESTAMP
      - name: source_file
        description: "{{ doc('source_file') }}"
        data_type: STRING
