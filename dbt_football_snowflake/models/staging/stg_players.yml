version: 2

models:
  - name: stg_players
    config:
      meta:
        owner: "Data Engineering"
      contract:
        enforced: true
    description: "{{ doc('stg_players_model_description') }}"
    columns:
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        data_type: STRING
        tests:
          - not_null
          - unique
      - name: player_id
        description: "{{ doc('player_id') }}"
        data_type: INT
        tests:
          - not_null
          - unique
      - name: current_club_id
        description: "{{ doc('current_club_id') }}"
        data_type: INT
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_clubs')
                field: club_id
      - name: player_name
        description: "{{ doc('player_name') }}"
        data_type: STRING
      - name: nationality
        description: "{{ doc('nationality') }}"
        data_type: STRING
      - name: position
        description: "{{ doc('position') }}"
        data_type: STRING
      - name: sub_position
        description: "{{ doc('sub_position') }}"
        data_type: STRING
      - name: foot
        description: "{{ doc('foot') }}"
        data_type: STRING
      - name: height_in_cm
        description: "{{ doc('height_in_cm') }}"
        data_type: INT
      - name: date_of_birth
        description: "{{ doc('date_of_birth') }}"
        data_type: DATE
      - name: age_in_years
        description: "{{ doc('age_in_years') }}"
        data_type: INT
      - name: last_season
        description: "{{ doc('last_season') }}"
        data_type: INT
      - name: loaded_timestamp
        description: "{{ doc('loaded_timestamp') }}"
        data_type: TIMESTAMP
      - name: source_file
        description: "{{ doc('source_file') }}"
        data_type: STRING
