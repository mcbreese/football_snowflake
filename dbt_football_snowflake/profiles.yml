dbt_football_snowflake:
  target: dev
  outputs:
    dev:
      type: snowflake
      # Connection Credentials
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"

      # Role & Compute Resources
      role: DEV_ROLE
      warehouse: DEV_TRANSFORM_WH

      # Target Landing Database for Dev
      database: DEV_ANALYTICS
      schema: football

      # Key-Pair setup (No password needed)
      private_key_path: "{{ env_var('PK_PATH', 'rsa_key.p8') }}"
      private_key_passphrase: "{{ env_var('PK_PASSPHRASE') }}"

      # Optimization settings
      threads: 1
      client_session_keep_alive: False

    ci:
      type: snowflake
      # Connection Credentials
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"

      # Role & Compute Resources
      role: CI_ROLE
      warehouse: DEV_TRANSFORM_WH

      # Throwaway per-PR schema, repurposed from the empty STG_ANALYTICS.
      # No default on DBT_CI_SCHEMA - an unset value should fail loudly,
      # not silently land in the wrong schema. See
      # macros/generate_schema_name.sql for how this collapses every
      # layer (stg/int/gold) into this one flat schema for CI builds.
      database: CI_ANALYTICS
      schema: "{{ env_var('DBT_CI_SCHEMA') }}"

      # Key-Pair setup (No password needed)
      private_key_path: "{{ env_var('PK_PATH', 'rsa_key.p8') }}"
      private_key_passphrase: "{{ env_var('PK_PASSPHRASE') }}"

      # Optimization settings
      threads: 4
      client_session_keep_alive: False

    # Claude Code's own local investigation target - CLAUDE_READONLY_ROLE
    # is never granted DEV_ROLE/CI_ROLE/PROD_ROLE, so this connection
    # cannot build/write regardless of what's asked of it (Snowflake
    # rejects the role switch outright, not just a followed convention).
    # Deliberately separate env var names (CLAUDE_SNOWFLAKE_USER/
    # CLAUDE_PK_PATH/CLAUDE_PK_PASSPHRASE, not SNOWFLAKE_USER/PK_PATH/
    # PK_PASSPHRASE) so there's no chance of this target accidentally
    # picking up the personal credential, or vice versa. See
    # snowflake/setup_claude_readonly_role.sql and secrets/.env.readonly.
    claude_readonly:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('CLAUDE_SNOWFLAKE_USER') }}"

      role: CLAUDE_READONLY_ROLE
      warehouse: DEV_TRANSFORM_WH

      database: DEV_ANALYTICS
      schema: football

      private_key_path: "{{ env_var('CLAUDE_PK_PATH') }}"
      private_key_passphrase: "{{ env_var('CLAUDE_PK_PASSPHRASE') }}"

      threads: 1
      client_session_keep_alive: False

    prod:
      type: snowflake
      # Connection Credentials
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"

      # Role & Compute Resources
      role: PROD_ROLE
      warehouse: DEV_TRANSFORM_WH

      # Source-of-truth production database. Never run against this
      # target without explicit confirmation - see CLAUDE.md.
      database: PRD_ANALYTICS
      schema: football

      # Key-Pair setup (No password needed)
      private_key_path: "{{ env_var('PK_PATH', 'rsa_key.p8') }}"
      private_key_passphrase: "{{ env_var('PK_PASSPHRASE') }}"

      # Optimization settings
      threads: 4
      client_session_keep_alive: False