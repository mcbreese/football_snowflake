version: 2

seeds:
  - name: dim_transfer_date
    config:
      meta:
        owner: "Analytics Department"
        usage: "Static date dimension for joining to fct_player_transfers"
    description: "{{ doc('dim_transfer_date_model_description') }}"
    columns:
      - name: date_key
        description: "{{ doc('date_key') }}"
        tests:
          - not_null
          - unique
      - name: date_day
        description: "{{ doc('date_day') }}"
        tests:
          - not_null
          - unique
      - name: transfer_season
        description: "{{ doc('transfer_season_dim') }}"
