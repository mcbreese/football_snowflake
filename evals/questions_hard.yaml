# Hint-free answer key: the same verified facts as questions.yaml, asked
# the way a user would, without the hints that gave the traps away. See
# evals/README.md for the grading rules.
#
# Where a question has more than one defensible reading, each one is listed
# under `readings` with its own verified SQL, and any of them passes. The
# results log records which reading the agent chose.
#
# Every `sql` was run through the Football_Snowflake MCP connector with the
# same read-only grants the agent under test has.

version: 1
verified_at: "2026-10-16"
# max(loaded_timestamp) on dim_players at verification time. If prod's
# value has moved on, re-run every `sql` below before trusting a score.
data_snapshot: "2026-09-10 08:55:21.735"

questions:
  - id: HL1
    category: lookup
    question: How many goals did Haaland score in 2022/23?
    answer_type: number
    tolerance: 0
    readings:
      - label: premier league only
        expected: 36
        sql: |
          select total_goals
          from prd_analytics.football_gold.fct_player_performance_per_season_competition
          where player_id = 418560
            and competition_name = 'premier-league'
            and season = 2022
      - label: all competitions
        expected: 51
        # The agent tends to add up the per-competition rows itself, so 51
        # never comes back from Snowflake; its parts must instead.
        grounding:
          - all_of: [36, 12, 3]
        sql: |
          select sum(total_goals)
          from prd_analytics.football_gold.fct_player_performance_per_season_competition
          where player_id = 418560
            and season = 2022
    notes: >-
      Same fact as L1, without naming the competition. All competitions =
      Premier League 36, Champions League 12, FA Cup 3, Community Shield 0.
      The season trap still applies: season 2023 gives 27 (league only).

  - id: HL2
    category: lookup
    question: What's Saka's stronger foot?
    answer_type: name
    expected: left
    accept: [left, left foot, left-footed]
    sql: |
      select player_name, player_id, foot
      from prd_analytics.football_gold.dim_players
      where regexp_like(player_name, '.*\\bSaka\\b.*', 'i')
    notes: >-
      Surname only. Two players match: Bukayo Saka (left) and Mathis Saka
      (right). "Saka" in ordinary use means Bukayo, so right is not
      accepted. An agent that notices both and refuses fails here; review
      whether that should count as a pass.

  - id: HA1
    category: aggregation
    question: Who was the top scorer in 2023/24?
    answer_type: name
    expected: Harry Kane
    accept: [Harry Kane, Kane]
    sql: |
      select p.player_name, sum(f.total_goals) as goals
      from prd_analytics.football_gold.fct_player_performance_per_season_competition as f
      inner join prd_analytics.football_gold.dim_players as p
          on f.player_id = p.player_id
      where f.season = 2023
      group by p.player_name
      order by goals desc
      limit 1
    notes: >-
      Both readings agree: Kane leads in a single competition (36,
      Bundesliga) and summed across competitions (44, next best 36). A
      league-specific reading (for example Premier League only) isn't
      defensible because no league is named.

  - id: HA2
    category: aggregation
    question: How many transfers in 2023/24 involved a fee?
    answer_type: number
    expected: 1306
    tolerance: 0
    sql: |
      select count(*)
      from prd_analytics.football_gold.fct_player_transfers
      where transfer_date between '2023-07-01' and '2024-06-30'
        and transfer_fee > 0
    cross_check_sql: |
      select count(*)
      from prd_analytics.football_gold.fct_player_transfers
      where transfer_season = '23/24'
        and transfer_fee > 0
    notes: >-
      Same fact as A2. The date window and the transfer_season column agree
      (1,306), so either way of reading "2023/24" passes. Trap: a fee of 0
      is a free transfer and a null fee is unknown, so counting non-null
      fees (6,576) fails.

  - id: HA3
    category: aggregation
    question: What was the average transfer fee in 2023/24, in millions of euros?
    answer_type: number
    tolerance: 0.05
    readings:
      - label: paid transfers only
        expected: 6.5
        grounding:
          - value: 6526704
            tolerance: 1
        sql: |
          select avg(transfer_fee) / 1000000
          from prd_analytics.football_gold.fct_player_transfers
          where transfer_date between '2023-07-01' and '2024-06-30'
            and transfer_fee > 0
      - label: free transfers included
        expected: 1.3
        grounding:
          - value: 1296210
            tolerance: 1
        sql: |
          select avg(transfer_fee) / 1000000
          from prd_analytics.football_gold.fct_player_transfers
          where transfer_date between '2023-07-01' and '2024-06-30'
    notes: >-
      Same fact as A3, without saying which transfers count. Both readings
      exclude unknown (null) fees; treating them as 0 gives 1.0, which
      fails. transfer_season = '23/24' gives the same two answers.

  - id: HA4
    category: aggregation
    question: How many players played in the Premier League in 2023/24?
    answer_type: number
    expected: 570
    tolerance: 0
    sql: |
      select count(distinct player_id)
      from prd_analytics.football_gold.fct_player_performance_per_season_competition
      where season = 2023
        and competition_name = 'premier-league'
    notes: >-
      Same fact as A4. Counting players with any row, with minutes, or with
      appearances all give 570, so "played" isn't ambiguous here.

  - id: HJ1
    category: join
    question: Which club spent the most on transfers in 2023/24?
    answer_type: name
    expected: Chelsea Football Club
    accept: [Chelsea, Chelsea FC, Chelsea Football Club]
    sql: |
      select c.name, sum(t.transfer_fee) as spent
      from prd_analytics.football_gold.fct_player_transfers as t
      inner join prd_analytics.football_gold.dim_clubs as c
          on t.to_club_id = c.club_id
      where t.transfer_date between '2023-07-01' and '2024-06-30'
      group by c.name
      order by spent desc
      limit 1
    notes: >-
      Same fact as J1. EUR 464.1m against Paris Saint-Germain's 454.5m by
      either date window or transfer_season.

  - id: HJ2
    category: join
    question: Which nationality had the most Premier League players in 2023/24?
    answer_type: name
    expected: England
    accept: [England, English]
    sql: |
      select p.nationality, count(distinct f.player_id) as players
      from prd_analytics.football_gold.fct_player_performance_per_season_competition as f
      inner join prd_analytics.football_gold.dim_players as p
          on f.player_id = p.player_id
      where f.season = 2023
        and f.competition_name = 'premier-league'
      group by p.nationality
      order by players desc
      limit 1
    notes: Same fact as J2. England 192, Brazil 33, France 28.

  - id: HT1
    category: time
    question: How many transfers were there in July 2024?
    answer_type: number
    expected: 3117
    tolerance: 0
    sql: |
      select count(*)
      from prd_analytics.football_gold.fct_player_transfers
      where transfer_date between '2024-07-01' and '2024-07-31'
    notes: Same fact as T1, which was already phrased without hints.

  - id: HR1
    category: refuse
    question: How much does Saka earn?
    answer_type: refuse
    expected: REFUSE
    notes: >-
      Same as R1. There's no wage or salary data. Market value or a
      transfer fee is not an answer.

  - id: HR2
    category: refuse
    question: Who's the best striker in the Premier League?
    answer_type: refuse
    expected: REFUSE
    notes: >-
      Same as R2 with a narrower group. "Striker" can be found
      (sub_position has Centre-Forward and Second Striker), but "best" is
      still undefined, so picking a top scorer fails.

  - id: HR3
    category: refuse
    question: Which league had the most red cards in 2023/24?
    answer_type: refuse
    expected: REFUSE
    sql: |
      select competition_name, sum(total_red_cards) as reds
      from prd_analytics.football_gold.fct_player_performance_per_season_competition
      where season = 2023
      group by competition_name
      order by reds desc
      limit 2
    notes: >-
      New trap. The naive answer is premier-liga (58, ahead of LaLiga on
      52), but that name covers both Russia's and Ukraine's leagues
      (issue #76) and nothing in the gold layer can split them, so the
      true answer is unknowable. LaLiga is also wrong: either league alone
      could still top 52.

  # Harder questions, added after the first hint-free run (16 Oct) showed
  # the set above was close to saturated. Each one targets a real pitfall in
  # this data.

  - id: HL3
    category: lookup
    question: How many goals did João Pedro score in 2023/24?
    answer_type: number
    tolerance: 0
    readings:
      - label: all competitions
        expected: 20
        grounding:
          - all_of: [9, 6, 5]
        sql: |
          select sum(total_goals)
          from prd_analytics.football_gold.fct_player_performance_per_season_competition
          where player_id = 626724
            and season = 2023
      - label: premier league only
        expected: 9
        sql: |
          select total_goals
          from prd_analytics.football_gold.fct_player_performance_per_season_competition
          where player_id = 626724
            and season = 2023
            and competition_name = 'premier-league'
    cross_check_sql: |
      select p.player_id, sum(f.total_goals), listagg(distinct f.competition_name, ',')
      from prd_analytics.football_gold.fct_player_performance_per_season_competition as f
      inner join prd_analytics.football_gold.dim_players as p
          on f.player_id = p.player_id
      where p.player_name = 'João Pedro'
        and f.season = 2023
      group by p.player_id
    notes: >-
      Trap: three different players are called João Pedro. The one people
      mean (Premier League, Europa League, FA Cup) scored 20 (9 + 6 + 5).
      The others scored 5 (Greece) and 0 (Portugal). Filtering on the name
      alone and summing gives 25, which fails, as do 5 and 0.

  - id: HA5
    category: aggregation
    question: What percentage of transfers in 2023/24 were free?
    answer_type: number
    tolerance: 0.1
    readings:
      - label: share of all transfers
        expected: 61.8
        grounding:
          - all_of: [5270, 8523]
        sql: |
          select round(100 * count_if(transfer_fee = 0) / count(*), 1)
          from prd_analytics.football_gold.fct_player_transfers
          where transfer_date between '2023-07-01' and '2024-06-30'
      - label: share of transfers with a known fee
        expected: 80.1
        grounding:
          - all_of: [5270, 6576]
        sql: |
          select round(100 * count_if(transfer_fee = 0) / count(transfer_fee), 1)
          from prd_analytics.football_gold.fct_player_transfers
          where transfer_date between '2023-07-01' and '2024-06-30'
    notes: >-
      Tests null handling. 8,523 transfers: 5,270 with a fee of 0, 1,947
      with no fee recorded, 1,306 paid. Counting unknown fees as free gives
      84.7, which fails. transfer_season = '23/24' gives 61.8 and 80.1 too.
      Grounding needs both the free count and the denominator, because the
      percentage itself is often computed by the agent.

  - id: HA6
    category: aggregation
    question: What was the most expensive transfer of 2023/24?
    answer_type: name
    expected: Declan Rice
    accept: [Declan Rice, Rice]
    sql: |
      select p.player_name, t.transfer_fee
      from prd_analytics.football_gold.fct_player_transfers as t
      inner join prd_analytics.football_gold.dim_players as p
          on t.player_id = p.player_id
      where t.transfer_date between '2023-07-01' and '2024-06-30'
      order by t.transfer_fee desc nulls last
      limit 1
    notes: >-
      EUR 116.6m (West Ham to Arsenal), just ahead of Moisés Caicedo on
      116.0m. Trap: ranking by market_value_in_eur gives Jude Bellingham
      (120m value, 113m fee). Same answer by transfer_season.

  - id: HA7
    category: aggregation
    question: Who was the most valuable player to change clubs in 2023/24?
    answer_type: name
    expected: Jude Bellingham
    accept: [Jude Bellingham, Bellingham]
    sql: |
      select p.player_name, t.market_value_in_eur, t.transfer_fee
      from prd_analytics.football_gold.fct_player_transfers as t
      inner join prd_analytics.football_gold.dim_players as p
          on t.player_id = p.player_id
      where t.transfer_date between '2023-07-01' and '2024-06-30'
      order by t.market_value_in_eur desc nulls last
      limit 1
    notes: >-
      The pair to HA6: "valuable" means market value (EUR 120m), not fee.
      Ranking by fee gives Declan Rice, which fails. Review: is the fee
      reading defensible enough to accept?

  - id: HJ3
    category: join
    question: Which club signed the most players in 2023/24?
    answer_type: name
    expected: Galatasaray Spor Kulübü
    accept: [Galatasaray, Galatasaray SK, Galatasaray Spor Kulübü]
    sql: |
      select c.name, count(*) as signings
      from prd_analytics.football_gold.fct_player_transfers as t
      inner join prd_analytics.football_gold.dim_clubs as c
          on t.to_club_id = c.club_id
      where t.transfer_date between '2023-07-01' and '2024-06-30'
      group by c.name
      order by signings desc
      limit 1
    cross_check_sql: |
      select to_club_id, count(*) as signings
      from prd_analytics.football_gold.fct_player_transfers
      where transfer_date between '2023-07-01' and '2024-06-30'
      group by to_club_id
      order by signings desc
      limit 2
    notes: >-
      41 signings. Trap: club_id 515 tops the raw count (164) but isn't in
      dim_clubs, never has a fee, never appears in match data, and is also
      a common from_club. It's very likely Transfermarkt's "without club"
      (inferred from the data, not confirmed). Answering 515 or "an unknown
      club" fails.

  - id: HJ4
    category: join
    question: Which club did Declan Rice play for in 2021/22?
    answer_type: name
    expected: West Ham United Football Club
    accept: [West Ham, West Ham United, West Ham United FC, West Ham United Football Club]
    sql: |
      select t.transfer_date, f.name as from_club, c.name as to_club
      from prd_analytics.football_gold.fct_player_transfers as t
      left join prd_analytics.football_gold.dim_clubs as f
          on t.from_club_id = f.club_id
      left join prd_analytics.football_gold.dim_clubs as c
          on t.to_club_id = c.club_id
      where t.player_id = 357662
      order by t.transfer_date
    notes: >-
      Trap: a real defect. fct_player_performance_per_season_competition
      gives club_id = Arsenal for every Rice season, because club_id is the
      player's current club, not the club at the time. The transfer history
      shows West Ham from July 2017 until the move to Arsenal on
      2023-07-15. Arsenal fails.
