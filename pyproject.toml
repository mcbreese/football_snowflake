[project]
name = "football-snowflake"
version = "0.1.0"
description = "dbt Core transformation pipeline for football transfer and performance data, on Snowflake."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.12.0",
    "dbt-snowflake>=1.12.0",
]

[dependency-groups]
dev = [
    "sqlfluff>=4.3.0",
    "sqlfluff-templater-dbt>=4.3.0",
]
